[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200
  force = true

[[redirects]]
  from = "/auth/confirm"
  to = "/auth/confirm/index.html"
  status = 200
  force = true

# Pretty admin URLs. /admin and /admin/login both serve the dashboard page.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
  force = true

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
