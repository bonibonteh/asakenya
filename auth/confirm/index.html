<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Confirm your email | ASA Kenya</title>
  <link rel="icon" href="/images/photo-3.jpg">
  <link rel="stylesheet" href="/admin.css">
  <style>
    body{min-height:100vh;background:#f7f8f5;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .confirm-card{width:min(100%,520px);padding:clamp(24px,5vw,38px)}
    .confirm-card h1{margin-top:0}.confirm-brand{font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#176638;font-size:.78rem}
    #confirm-message{line-height:1.65}.confirm-ok{color:#176638}.confirm-error{color:#b42318}
    .confirm-card a{font-weight:700}#confirm-resend{margin-top:18px;border-top:1px solid #e3e6e0;padding-top:16px}
    #confirm-resend input{width:100%;box-sizing:border-box;margin:8px 0}#confirm-resend button{width:100%}
    #resend-message{margin-top:10px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card confirm-card">
    <p class="confirm-brand">ASA Kenya</p>
    <h1 id="confirm-title">Email confirmation</h1>
    <p id="confirm-message" role="status" aria-live="polite">Checking your confirmation link…</p>
    <p id="confirm-action"></p>
    <section id="confirm-resend" hidden>
      <form id="resend-form">
        <label for="resend-email">Email address</label>
        <input id="resend-email" name="email" type="email" autocomplete="email" required>
        <button class="btn" type="submit">Send me a new confirmation link</button>
        <p id="resend-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <noscript><p class="confirm-error">JavaScript is required to confirm your email. Please enable it and reload this page.</p></noscript>
  </main>
  <script src="/config.js"></script>
  <script src="/supa.js"></script>
  <script src="/auth-confirm.js"></script>
</body>
</html>
