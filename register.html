<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create an account | ASAKenya"><link rel="icon" href="/images/photo-3.jpg"><link rel="stylesheet" href="/admin.css"><style>
body{min-height:100vh;background:#f7f8f5}.register-wrap{width:min(100% - 32px,520px);margin:clamp(28px,7vh,72px) auto}.register-brand{font-weight:800;letter-spacing:.08em;color:#176638;text-transform:uppercase;font-size:.78rem;margin-bottom:10px}.register-card{padding:clamp(22px,5vw,36px)}.register-card h1{margin-top:0}.register-card label{display:block;margin:14px 0}.register-card input{width:100%;box-sizing:border-box}.register-card .btn{box-sizing:border-box}.register-foot{margin-top:18px;text-align:center}.register-foot a{color:#176638;font-weight:700}#register-message{margin-top:14px}
</style></head><body>
<header class="bar"><b>ASA Kenya</b><a href="/" class="btn o s" style="text-decoration:none">Back to website</a></header>
<main class="register-wrap"><p class="register-brand">ASAKenya workspace</p><section class="card register-card">
<h1>Create your account</h1><p class="note">Welcome to ASAKenya. Register with your details to get started.</p>
<form id="asa-register-form">
<label>Full name<input name="full_name" type="text" autocomplete="name" maxlength="120" required></label>
<label>Email address<input name="email" type="email" autocomplete="email" required></label>
<label>Password (at least 8 characters)<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label>Confirm password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="btn" type="submit" style="width:100%">Create account</button><p id="register-message" role="status" aria-live="polite"></p>
</form><p class="register-foot">Already have an account? <a href="/admin">Sign in</a></p><p class="note">Creating an account does not automatically grant staff or administrator permissions.</p>
</section></main><script src="/config.js"></script><script src="/supa.js"></script><script src="/register.js"></script><script src="/auth-enhance.js"></script></body></html>
